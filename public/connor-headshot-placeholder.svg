<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title description">
  <title id="title">Connor Worthington portrait placeholder</title>
  <desc id="description">A dark navy and cyan branded placeholder for the Norivex Cyber founder photo.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123b4d" />
      <stop offset="0.72" stop-color="#071722" />
      <stop offset="1" stop-color="#04101a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="32%" r="45%">
      <stop offset="0" stop-color="#56e6eb" stop-opacity="0.32" />
      <stop offset="1" stop-color="#56e6eb" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#background)" />
  <rect width="800" height="1000" fill="url(#glow)" />
  <g fill="none" stroke="#56e6eb" stroke-opacity="0.2">
    <ellipse cx="400" cy="345" rx="280" ry="235" />
    <ellipse cx="400" cy="345" rx="205" ry="315" transform="rotate(90 400 345)" />
  </g>
  <text x="400" y="425" fill="#56e6eb" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="500" letter-spacing="-12" text-anchor="middle">CW</text>
  <text x="56" y="875" fill="#7e9daa" font-family="monospace" font-size="18" letter-spacing="3">HEADSHOT PLACEHOLDER</text>
  <text x="56" y="920" fill="#eef8f8" font-family="Arial, Helvetica, sans-serif" font-size="26">Connor Worthington</text>
</svg>
